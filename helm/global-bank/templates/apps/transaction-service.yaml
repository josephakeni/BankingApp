apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.transactionService.replicas }}
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis-service 6379; do echo waiting for redis; sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka-service 9092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: transaction-service
          image: "{{ .Values.transactionService.image.repository }}:{{ .Values.transactionService.image.tag }}"
          resources:
            requests:
              cpu: {{ .Values.transactionService.resources.requests.cpu | quote }}
              memory: {{ .Values.transactionService.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.transactionService.resources.limits.cpu | quote }}
              memory: {{ .Values.transactionService.resources.limits.memory | quote }}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: banking-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: postgres-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: postgres-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: banking-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: banking-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: banking-config
                  key: REDIS_PORT
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: banking-config
                  key: FRONTEND_ORIGIN
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: transaction-service
  ports:
    - port: 8080
