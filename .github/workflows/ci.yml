name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION:     ${{ vars.AWS_REGION || 'eu-west-1' }}
  ECR_REGISTRY:   ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'eu-west-1' }}.amazonaws.com
  IMAGE_PREFIX:   ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'eu-west-1' }}.amazonaws.com/techbleat
  DOMAIN:         brightstaraid.org

jobs:
  # ── Tests ─────────────────────────────────────────────────────────────────
  test-transaction-service:
    name: Test transaction-service (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: techbleat-global-bank-backend/transaction-service
        run: mvn test --no-transfer-progress

  test-frontend:
    name: Test frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: techbleat-global-bank-frontend/package-lock.json

      - name: Install dependencies
        working-directory: techbleat-global-bank-frontend
        run: npm ci

      - name: Build (lint + compile check)
        working-directory: techbleat-global-bank-frontend
        run: npm run build

  # ── Build & Push to ECR ───────────────────────────────────────────────────
  build-backend:
    name: Build ${{ matrix.service }}
    needs: [test-transaction-service, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            context: ./techbleat-global-bank-backend/user-service
          - service: activity-service
            context: ./techbleat-global-bank-backend/activity-service
          - service: transaction-service
            context: ./techbleat-global-bank-backend/transaction-service

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-frontend:
    name: Build frontend
    needs: [test-transaction-service, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./techbleat-global-bank-frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: |
            VITE_USER_API=https://${{ env.DOMAIN }}
            VITE_TX_API=https://${{ env.DOMAIN }}
            VITE_ACTIVITY_API=https://${{ env.DOMAIN }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Deploy to EKS ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ vars.EKS_CLUSTER_NAME }}

      # Write real credentials into Secrets Manager from the GitHub secret.
      # Terraform only creates the secret shell; the value is owned by CI.
      - name: Populate Secrets Manager credentials
        run: |
          aws secretsmanager put-secret-value \
            --region ${{ env.AWS_REGION }} \
            --secret-id banking/db-credentials \
            --secret-string "{\"postgres-username\":\"bankuser\",\"postgres-password\":\"${{ secrets.DB_PASSWORD }}\",\"postgres-db\":\"bankingdb\"}"

      - name: Export certificate ARN
        run: |
          echo "CERTIFICATE_ARN=$(aws acm list-certificates \
            --region ${{ env.AWS_REGION }} \
            --query "CertificateSummaryList[?DomainName=='${{ env.DOMAIN }}'].CertificateArn" \
            --output text)" >> $GITHUB_ENV

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Single command replaces all kubectl apply steps, kubectl set image,
      # and rollout status waits. --atomic auto-rolls back on failure.
      - name: Helm deploy
        run: |
          helm upgrade --install global-bank ./helm/global-bank \
            --namespace banking \
            --create-namespace \
            --set ingress.certificateArn=${{ env.CERTIFICATE_ARN }} \
            --set userService.image.tag=${{ github.sha }} \
            --set transactionService.image.tag=${{ github.sha }} \
            --set activityService.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --atomic \
            --timeout 5m

      # Wait for the ALB to be provisioned then update Route 53.
      # Uses banking-ingress-frontend since it owns the ALB in the grouped setup.
      - name: Update Route 53 ALB alias record
        run: |
          echo "Waiting for ALB hostname from ingress..."
          for i in $(seq 1 20); do
            ALB=$(kubectl get ingress banking-ingress-frontend -n banking \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            [ -n "$ALB" ] && break
            echo "  attempt $i — not ready yet, retrying in 15s..."
            sleep 15
          done

          if [ -z "$ALB" ]; then
            echo "ERROR: ALB hostname not available after 5 minutes" && exit 1
          fi

          echo "ALB hostname: $ALB"

          aws route53 change-resource-record-sets \
            --hosted-zone-id ${{ vars.ROUTE53_ZONE_ID }} \
            --change-batch "{
              \"Changes\": [{
                \"Action\": \"UPSERT\",
                \"ResourceRecordSet\": {
                  \"Name\": \"${{ env.DOMAIN }}.\",
                  \"Type\": \"A\",
                  \"AliasTarget\": {
                    \"HostedZoneId\": \"Z32O12XQLNTSW2\",
                    \"DNSName\": \"$ALB.\",
                    \"EvaluateTargetHealth\": true
                  }
                }
              }]
            }"

          # Persist the new ALB hostname as a GitHub variable for reference (best-effort)
          gh variable set ALB_URL --body "$ALB" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
