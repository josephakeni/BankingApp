# ServiceAccount for the External Secrets Operator.
# The IRSA annotation links it to the IAM role created by Terraform.
# Replace EXTERNAL_SECRETS_ROLE_ARN with the value of:
#   terraform output -raw external_secrets_role_arn
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::399839753928:role/external-secrets-techbleat-banking-2026061420260540380000000e"
