# Pulls the banking/db-credentials secret from AWS Secrets Manager and creates
# a Kubernetes Secret named banking-secrets in the banking namespace.
# The AWS secret must contain keys: postgres-username, postgres-password, postgres-db
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banking-db-credentials
  namespace: banking
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: banking-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres-username
      remoteRef:
        key: banking/db-credentials
        property: postgres-username
    - secretKey: postgres-password
      remoteRef:
        key: banking/db-credentials
        property: postgres-password
    - secretKey: postgres-db
      remoteRef:
        key: banking/db-credentials
        property: postgres-db
